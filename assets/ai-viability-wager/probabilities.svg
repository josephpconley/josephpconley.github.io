<script><![CDATA[
(function(){var t=document.getElementById("tip"),tx=t.querySelectorAll("text");
function show(g){var p=g.getAttribute("data-tip").split("|"),x=+g.getAttribute("data-x"),y=+g.getAttribute("data-y");
for(var i=0;i<4;i++)tx[i].textContent=p[i];var tl=g.querySelector("title");if(tl&&tl.textContent){g._t=tl.textContent;tl.textContent="";}
var bx=x+12>670?x-162:x+12,by=Math.max(42,Math.min(y-37,314));
t.setAttribute("transform","translate("+bx+","+by+")");t.setAttribute("visibility","visible");}
function hide(g){var tl=g.querySelector("title");if(tl&&g._t)tl.textContent=g._t;t.setAttribute("visibility","hidden");}
[].forEach.call(document.querySelectorAll(".pt"),function(g){
g.addEventListener("mouseenter",function(){show(g)});g.addEventListener("mouseleave",function(){hide(g)});
g.addEventListener("focus",function(){show(g)});g.addEventListener("blur",function(){hide(g)});
g.addEventListener("click",function(){show(g)});});})();
]]></script>
